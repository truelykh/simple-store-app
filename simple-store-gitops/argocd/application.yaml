apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/simple-store-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: simple-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
