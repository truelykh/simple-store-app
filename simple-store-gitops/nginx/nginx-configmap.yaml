apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: simple-store
data:
  default.conf: |
    server {
      listen 80;

      location / {
        proxy_pass http://frontend:80;
      }

      location /api/users/ {
        proxy_pass http://user-service:8080/api/users/;
      }

      location /api/products/ {
        proxy_pass http://product-service:8080/api/products/;
      }

      location /api/orders/ {
        proxy_pass http://order-service:8080/api/orders/;
      }

      location /api/payments/ {
        proxy_pass http://payment-service:8080/api/payments/;
      }

      location /api/notifications/ {
        proxy_pass http://notification-service:8080/api/notifications/;
      }
    }
