apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/truelykh/simple-store-app.git
    targetRevision: main
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: simple-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
